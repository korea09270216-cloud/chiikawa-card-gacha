<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="우주 속 카드 꾸러미를 고르고, 밀봉 팩을 뜯어 숨겨진 카드를 만나보세요.">
  <title>CHIIKAWA — CARD PACK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23000'/%3E%3Cpath d='M32 8 38 26 56 32 38 38 32 56 26 38 8 32 26 26Z' fill='%23e7ca82'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/chiikawa-box-front.webp" as="image">
  <link rel="stylesheet" href="styles.css?v=11">
  <link rel="stylesheet" href="box3d.css?v=11">
  <link rel="stylesheet" href="card-shine.css?v=11">
  <link rel="stylesheet" href="grade-fx.css?v=11">
  <link rel="stylesheet" href="titles.css?v=11">
  <script src="app.js?v=11" type="module"></script>
</head>
<body>
  <main id="scene" data-phase="packs" data-view="packs" aria-label="우주 속 카드 꾸러미와 카드팩">
    <canvas id="space" aria-hidden="true"></canvas>
    <canvas id="light-canvas" aria-hidden="true"></canvas>
    <div class="radiance" aria-hidden="true"></div>
    <div class="light-bloom" aria-hidden="true"></div>
    <div class="shockwave" aria-hidden="true"></div>
    <button id="choose-bundle" class="quiet-button bundle-back" hidden><span aria-hidden="true">←</span> 카드팩 목록</button>
    <section id="bundle-stage" aria-label="카드 꾸러미" hidden></section>
    <div class="pack-position" id="pack-position" hidden>
      <div class="pack-float">
        <button id="pack-button" aria-label="밀봉된 치이카와 카드팩 뜯기" aria-describedby="pack-instruction">
          <span class="pack-tilt" data-magnetic data-base="-4">
            <span class="packet-layer pack-lower"><img width="948" height="1659" alt="미개봉 카드팩" draggable="false"></span>
            <span class="packet-layer pack-cap" aria-hidden="true"><span class="cap-shape"><img width="948" height="1659" alt="" draggable="false"></span></span>
            <span class="packet-layer pack-peel" aria-hidden="true"><span class="cap-shape"><img width="948" height="1659" alt="" draggable="false"></span></span>
            <span class="pack-glint" aria-hidden="true"></span>
            <span class="tear-light" aria-hidden="true"></span>
            <span class="tear-spark" aria-hidden="true"></span>
            <span class="tear-guide" aria-hidden="true"><span class="tg-line"></span><span class="tg-hand"><i></i></span></span>
          </span>
        </button>
      </div>
    </div>
    <section id="pack-list" aria-labelledby="pack-list-title">
      <div class="collection-inner">
        <div class="collection-heading"><h2 id="pack-list-title" tabindex="-1">카드팩 목록</h2><p id="pack-list-note"></p></div>
        <div id="pack-grid"></div>
      </div>
    </section>
    <div id="reveal-zone" hidden></div>
    <section id="collection-panel" aria-labelledby="collection-title" hidden>
      <div class="collection-inner">
        <div class="collection-heading"><h2 id="collection-title" tabindex="-1">카드 목록</h2><p id="collection-count"></p></div>
        <div class="list-switch" role="group" aria-label="목록 전환"><button type="button" data-list-switch="cards" aria-pressed="true">카드 목록</button><button type="button" data-list-switch="titles" aria-pressed="false">칭호 목록</button></div>
        <div id="pack-tabs" role="group" aria-label="카드팩별 목록"></div>
        <div id="grade-chips" role="group" aria-label="등급으로 이동" hidden></div>
        <p id="collection-summary"></p>
        <div id="collection-grid"></div>
      </div>
    </section>
    <section id="title-panel" aria-labelledby="title-heading" hidden>
      <div class="collection-inner">
        <div class="collection-heading"><h2 id="title-heading" tabindex="-1">칭호 목록</h2><p id="title-count"></p></div>
        <div class="list-switch" role="group" aria-label="목록 전환"><button type="button" data-list-switch="cards" aria-pressed="false">카드 목록</button><button type="button" data-list-switch="titles" aria-pressed="true">칭호 목록</button></div>
        <p id="title-summary"></p>
        <div id="title-grid"></div>
      </div>
    </section>
    <p id="quip" class="quip"></p>
    <div id="result-actions" hidden>
      <button id="card-list" class="quiet-button" aria-controls="collection-panel" aria-expanded="false">카드 목록 <span aria-hidden="true">▦</span></button>
      <button id="title-list" class="quiet-button" aria-controls="title-panel" hidden>칭호 목록 <span aria-hidden="true">★</span></button>
      <button id="next-pack" class="quiet-button">카드뽑기 <span aria-hidden="true">↻</span></button>
      <a id="save-card" class="quiet-button" download hidden>카드 저장 <span aria-hidden="true">↓</span></a>
    </div>
    <p id="hint-bundle" class="hint" aria-hidden="true">꾸러미를 눌러 열어보세요</p>
    <p id="hint-pack" class="hint" aria-hidden="true">팩을 누르거나, 윗부분을 옆으로 밀어 뜯어보세요</p>
    <p id="pack-instruction" class="sr-only">클릭하거나 Enter 키를 누르거나 팩 윗부분을 옆으로 드래그하면 팩이 뜯어지고 카드 한 장이 나타납니다.</p>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <div id="title-toast" class="title-toast" hidden>
    <div class="tt-panel" role="dialog" aria-modal="true" aria-labelledby="tt-header" aria-describedby="tt-line" tabindex="-1" data-tier="common">
      <span class="tt-spark" aria-hidden="true"></span><span class="tt-spark" aria-hidden="true"></span><span class="tt-spark" aria-hidden="true"></span><span class="tt-spark" aria-hidden="true"></span><span class="tt-spark" aria-hidden="true"></span><span class="tt-spark" aria-hidden="true"></span>
      <p class="tt-eyebrow"><span id="tt-eyebrow"></span> <small id="tt-index"></small></p>
      <h2 class="tt-header" id="tt-header"></h2>
      <p class="tt-flavor" id="tt-flavor"></p>
      <p class="tt-sub" id="tt-sub" hidden></p>
      <p class="tt-line" id="tt-line"></p>
      <p class="tt-more" id="tt-more" hidden></p>
      <div class="tt-actions"><button type="button" id="title-ok" class="tt-ok"></button><button type="button" id="title-open" class="tt-open"></button></div>
    </div>
  </div>
  <noscript>팩을 뜯으려면 브라우저에서 JavaScript를 켜주세요.</noscript>
</body>
</html>
