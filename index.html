<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="검은 우주, 밀봉된 카드팩 하나. 클릭해서 안에 숨겨진 카드를 만나보세요.">
  <title>CHIIKAWA — SECRET PACK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23000'/%3E%3Cpath d='M32 8 38 26 56 32 38 38 32 56 26 38 8 32 26 26Z' fill='%23e7ca82'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/secret-pack.png" as="image">
  <link rel="stylesheet" href="styles.css?v=2">
  <script src="app.js?v=2" type="module"></script>
</head>
<body>
  <main id="scene" data-phase="sealed" aria-label="우주 속 미개봉 카드팩">
    <canvas id="space" aria-hidden="true"></canvas>
    <canvas id="light-canvas" aria-hidden="true"></canvas>
    <div class="radiance" aria-hidden="true"></div>
    <div class="light-bloom" aria-hidden="true"></div>
    <div class="shockwave" aria-hidden="true"></div>
    <div class="pack-position" id="pack-position">
      <div class="pack-float">
        <button id="pack-button" aria-label="밀봉된 치이카와 카드팩 뜯기" aria-describedby="pack-instruction">
          <span class="pack-tilt" data-magnetic data-base="-4">
            <span class="packet-layer pack-lower"><img src="assets/secret-pack.png" width="948" height="1659" alt="미개봉 치이카와 시크릿 카드팩" draggable="false" fetchpriority="high"></span>
            <span class="packet-layer pack-cap" aria-hidden="true"><img src="assets/secret-pack.png" width="948" height="1659" alt="" draggable="false"></span>
            <span class="pack-glint" aria-hidden="true"></span>
            <span class="tear-light" aria-hidden="true"></span>
            <span class="tear-spark" aria-hidden="true"></span>
          </span>
        </button>
      </div>
    </div>
    <div id="reveal-zone" hidden></div>
    <div id="result-actions" hidden>
      <button id="next-pack" class="quiet-button">한 팩 더 <span aria-hidden="true">↻</span></button>
      <a id="save-card" class="quiet-button" download>카드 저장 <span aria-hidden="true">↓</span></a>
    </div>
    <p id="pack-instruction" class="sr-only">클릭하거나 Enter 키를 누르면 팩이 뜯어지고 카드 한 장이 나타납니다.</p>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <noscript>팩을 뜯으려면 브라우저에서 JavaScript를 켜주세요.</noscript>
</body>
</html>
